# Railway / Nixpacks build configuration
# Python for the bot, Node.js for yt-dlp's YouTube challenge solving,
# ffmpeg for merging video+audio and thumbnail conversion.

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "nodejs_20", "ffmpeg"]

[phases.install]
cmds = ["pip install -r ytbot/requirements.txt"]

[start]
cmd = "cd ytbot && python3.11 main.py"
